<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Одна ли сеть?</title>
<style>
:root{--bg:#090c10;--card:#121a22;--line:#293541;--text:#eef5fb;--muted:#9aa9b7;--blue:#49adff;--green:#42d38b;--red:#ff716b;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 16px 40px;background:radial-gradient(800px 380px at 90% -10%,#12375a66,transparent 60%),var(--bg)}
main{max-width:620px;margin:auto}h1{font-size:26px;letter-spacing:-.04em;margin:0 0 6px}p{color:var(--muted);line-height:1.5;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ip{background:#0b1117;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.ip small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.ip b{font:700 19px ui-monospace,monospace}.mask{text-align:center;margin:12px 0 0;color:var(--muted);font:14px ui-monospace,monospace}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{font:inherit;color:inherit;border:1px solid var(--line);background:#17212b;border-radius:14px;padding:14px;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:default}.primary{background:linear-gradient(135deg,#268fe8,#58b8ff);color:#06131e;border:0}
.res{margin-top:14px;padding:13px;border-radius:14px;line-height:1.5;font-size:14px;display:none}.res.ok{display:block;background:#10281d;border:1px solid #2d7356}.res.bad{display:block;background:#2a1313;border:1px solid #7a3030}
.stats{display:flex;gap:16px;color:var(--muted);font-size:13px}.stats b{color:var(--text)}.bar{height:6px;border-radius:9px;background:#26323d;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--green);width:0;transition:.25s}
@media (prefers-color-scheme:light){:root{--bg:#f3f7fa;--card:#fff;--line:#d9e3eb;--text:#12202c;--muted:#647584}.ip{background:#f4f8fb}body{background:var(--bg)}.row button{background:#eef4f7}}
</style>
</head>
<body>
<main>
<h1>Одна ли сеть?</h1>
<p>Два адреса и маска: могут ли эти устройства общаться напрямую, без роутера? Ответьте 10 раз подряд верно — получите отметку.</p>
<div class="card">
  <div class="stats"><span>Подряд верно: <b id="streak">0</b> / 10</span><span>Лучший результат: <b id="best">0</b></span></div>
  <div class="bar"><i id="bar"></i></div>
</div>
<div class="card">
  <div class="pair"><div class="ip"><small>Компьютер</small><b id="a"></b></div><div class="ip"><small>Принтер</small><b id="b"></b></div></div>
  <div class="mask" id="mask"></div>
  <div class="row"><button class="primary" id="yes">Одна сеть</button><button id="no">Разные сети</button></div>
  <div class="res" id="res"></div>
  <div class="row"><button id="next" style="grid-column:1/3" disabled>Следующий вопрос</button></div>
</div>
<script src="/api/learn/bridge.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)},rnd=function(n){return Math.floor(Math.random()*n)};
var prog={done:[],best:0},streak=0,cur=null,locked=false;
var masks=[[24,'255.255.255.0'],[25,'255.255.255.128'],[26,'255.255.255.192'],[27,'255.255.255.224'],[28,'255.255.255.240']];
function toInt(o){return ((o[0]<<24)|(o[1]<<16)|(o[2]<<8)|o[3])>>>0}
function toStr(n){return [n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.')}
function make(){
  var m=masks[rnd(masks.length)],bits=m[0],size=Math.pow(2,32-bits);
  var base=toInt([192,168,rnd(4),0])+rnd(256/size)*size;
  var a=base+1+rnd(size-2),same=Math.random()<.5,b;
  if(same){do{b=base+1+rnd(size-2)}while(b===a)}
  else{var other=base+(Math.random()<.5?size:-size);b=other+1+rnd(size-2)}
  if(b<0)b=base+size+1;
  var net=function(x){return (x&~(size-1))>>>0};
  return {a:a,b:b,mask:m[1],bits:bits,size:size,same:net(a)===net(b),netA:net(a),netB:net(b)};
}
function show(){cur=make();locked=false;$('#a').textContent=toStr(cur.a);$('#b').textContent=toStr(cur.b);$('#mask').textContent='маска '+cur.mask+'  (/'+cur.bits+')';
  $('#res').className='res';$('#next').disabled=true;$('#yes').disabled=$('#no').disabled=false}
function draw(){$('#streak').textContent=streak;$('#best').textContent=prog.best;$('#bar').style.width=Math.min(100,streak*10)+'%'}
function save(){RLLearn.save({done:prog.done,best:prog.best}).then(function(r){prog=Object.assign(prog,r);draw()}).catch(function(){})}
function answer(say){
  if(locked)return;locked=true;$('#yes').disabled=$('#no').disabled=true;var ok=say===cur.same,r=$('#res');
  var why='Адрес сети первого: '+toStr(cur.netA)+', второго: '+toStr(cur.netB)+'. '+(cur.same?'Они совпадают — устройства в одной сети.':'Они разные — нужен роутер между ними.');
  r.className='res '+(ok?'ok':'bad');r.textContent=(ok?'Верно. ':'Неверно. ')+why;
  if(ok){streak++;if(streak>prog.best)prog.best=streak;if(streak>=10&&prog.done.indexOf('streak10')<0)prog.done=prog.done.concat(['streak10']);save()}else streak=0;
  draw();$('#next').disabled=false;
}
$('#yes').onclick=function(){answer(true)};$('#no').onclick=function(){answer(false)};$('#next').onclick=show;
RLLearn.load().then(function(r){prog={done:r.done||[],best:r.best||0};draw()}).catch(function(){});
show();draw();
})();
</script>
</main>
</body>
</html>
